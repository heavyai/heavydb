[ODBC Drivers]
PostgreSQL=Installed
Snowflake=Installed
Redshift=Installed
BigQuery=Installed
ApacheHive=Installed

[PostgreSQL]
Description=PostgreSQL ODBC driver
Driver=/usr/lib/x86_64-linux-gnu/odbc/psqlodbca.so

[Snowflake]
Description=Snowflake ODBC driver
Driver=/usr/lib/snowflake/odbc/lib/libSnowflake.so

[Redshift]
Description=Redshift ODBC driver
Driver=/opt/amazon/redshiftodbc/lib/64/libamazonredshiftodbc64.so

[BigQuery]
Description=BigQuery ODBC driver
Driver=/opt/simba/bigqueryodbc/lib/libgooglebigqueryodbc_sb64.so

[ApacheHive]
Description=Apache Hive ODBC Driver
Driver=/opt/cloudera/hiveodbc/lib/64/libclouderahiveodbc64.so
