name = "tpch"
description = "TPC-H decision support benchmark (22 queries)"
iterations = 3
warmup = 1

# Substituted into schema.sql as ${NAME}; override per run with --var NAME=VALUE.
# Must match the dataset's Parquet decimal precision (15 for most generators, 12 for gqe-dbgen).
[vars]
DEC_PRECISION = 15

# Each table's data lives in <dataset-root>/<path>/ as one or more parquet files
# (names are not assumed).  Override `path`/`glob` per table if a dataset differs.
[[tables]]
name = "region"
[[tables]]
name = "nation"
[[tables]]
name = "supplier"
[[tables]]
name = "customer"
[[tables]]
name = "part"
[[tables]]
name = "partsupp"
[[tables]]
name = "orders"
[[tables]]
name = "lineitem"

# Queries HeavyDB cannot currently run: name = "reason"
[disabled]
q21 = "correlated EXISTS/NOT EXISTS with <> predicate: no equijoin (hash join failure)"

# Queries whose result check is expected to fail against the reference (still run and timed):
# a failure is reported as "expected-failure", a pass as "passed".
[verify_xfail]
q04 = "HeavyDB's correlated EXISTS returns wrong, run-to-run varying counts (server bug)"
q08 = "decimal division truncates instead of rounding: mkt_share is off by up to 1e-4 on decimal data"
